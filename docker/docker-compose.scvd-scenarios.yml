# docker/docker-compose.scvd-scenarios.yml
# Deterministic 5-stream SCVD RTSP scenario benchmark.
#
# Usage from project root:
#   docker compose -f docker/docker-compose.scvd-scenarios.yml up -d --build
#
# Verify:
#   docker logs rtsp_pusher --tail 80
#   curl http://localhost:9997/v3/paths/list

services:

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    ports:
      - "8554:8554"
      - "18888:8888"
      - "8889:8889"
      - "8189:8189/udp"
      - "9997:9997"
    environment:
      MTX_PROTOCOLS: tcp
    volumes:
      - ../config/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - scvd-scenario-net
    restart: unless-stopped

  rtsp_pusher:
    build:
      context: ..
      dockerfile: docker/Dockerfile.rtsp-pusher
    container_name: rtsp_pusher
    command: python /app/rtsp_pusher.py
    environment:
      METADATA_FILE: /app/data/metadata/camera_registry.csv
      CAMERA_PLAYLISTS_FILE: /app/data/metadata/camera_playlists.json
      SCENARIO_METADATA_FILE: /app/data/metadata/camera_scenarios.json
      SCVD_DATA_ROOT: /app/data/raw/SCVD/SCVD_converted
      MEDIAMTX_HOST: mediamtx
      MAX_CAMERAS: "5"
      ACTIVE_CAMERAS: "cam_01,cam_02,cam_03,cam_04,cam_05"
      PLAYLIST_REPEAT: "1"
      STOP_FILE: /app/tmp/STOP
    volumes:
      - ../scripts/streaming/rtsp_pusher.py:/app/rtsp_pusher.py:ro
      - ../data/raw/SCVD/SCVD_converted:/app/data/raw/SCVD/SCVD_converted:ro
      - ../data/metadata:/app/data/metadata:ro
      - scvd-pusher-tmp:/app/tmp
    depends_on:
      mediamtx:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "2.00"
    networks:
      - scvd-scenario-net
    restart: on-failure

  rtsp-inference-mock:
    build:
      context: ..
      dockerfile: docker/Dockerfile.producer
    container_name: rtsp-inference-mock
    command: python /app/scripts/rtsp_inference_mock.py
    environment:
      KAFKA_BROKER: "34.124.131.144:9093"
      KAFKA_TOPIC: urban-safety-alerts
      METADATA_FILE: /app/data/metadata/camera_registry.csv
      STOP_FILE: /app/tmp/STOP
      RTSP_FPS: "1"
      RTSP_TIMEOUT_S: "5"
      RECONNECT_DELAY_S: "2"
      PYTHONUNBUFFERED: "1"
      ACTIVE_CAMERAS: "cam_01,cam_02,cam_03,cam_04,cam_05"
    volumes:
      - ../scripts/streaming:/app/scripts:ro
      - ../data:/app/data:ro
      - scvd-inference-tmp:/app/tmp
    depends_on:
      mediamtx:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.00"
    networks:
      - scvd-scenario-net
    restart: on-failure

networks:
  scvd-scenario-net:
    name: scvd-scenario-net

volumes:
  scvd-pusher-tmp:
  scvd-inference-tmp:
