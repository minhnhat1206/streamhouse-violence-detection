
services:
  kafka:
    container_name: kafka
    image: apache/kafka:4.0.1-rc2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "19092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --version || exit 1"]
      interval: 15s
      timeout: 30s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
    networks:
      - violence-detection-net
    restart: unless-stopped

  # --- Kafka UI (optional) ---
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    profiles: [ui]
    ports:
      - "18085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kraft-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: ""
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/api/clusters || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "0.25"
    networks:
      - violence-detection-net
    restart: unless-stopped

  # --- MinIO ---
  minio:
    image: dataguy16/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-mypassword}
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
    networks:
      - violence-detection-net
    restart: unless-stopped

  # --- MinIO Client ---
  minio_client:
    image: dataguy16/minio-client:latest
    container_name: minio_client
    depends_on:
      - minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-mypassword}
    entrypoint: >
      /bin/sh -c "
        sleep 20 && \
        mc alias set minio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && \
        mc mb minio/inference-results || true && \
        mc mb minio/checkpoint || true && \
        mc mb minio/evidence-frames || true && \
        mc mb minio/warehouse || true && \
        mc anonymous set download minio/inference-results || true && \
        mc anonymous set download minio/evidence-frames || true && \
        tail -f /dev/null
      "
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.10"
    networks:
      - violence-detection-net

  # --- RTSP Pusher (optional — real camera streaming) ---
  # Pushes RWF-2000 .avi clips to MediaMTX via ffmpeg.
  # rtsp-inference-mock then captures frames from these streams.
  rtsp_pusher:
    image: docker-rtsp_pusher:latest   # use pre-built image (has ffmpeg+python)
    command: python /app/rtsp_pusher.py
    container_name: rtsp_pusher
    profiles: [streaming]
    environment:
      METADATA_FILE: /app/data/metadata/camera_registry.csv
      FIGHT_DIR: /app/data/raw/RWF-2000/train/Fight
      NON_FIGHT_DIR: /app/data/raw/RWF-2000/train/NonFight
      FIGHT_MANIFEST: /app/data/metadata/fight_clips_manifest.txt
      NONFIGHT_MANIFEST: /app/data/metadata/nonfight_clips_manifest.txt
      MEDIAMTX_HOST: mediamtx
      MAX_CAMERAS: "5"       # limit ffmpeg processes to avoid CPU overload
      CLIPS_PER_CAM: "6"
      STOP_FILE: /app/tmp/STOP
    volumes:
      - ../scripts/streaming/rtsp_pusher.py:/app/rtsp_pusher.py:ro  # mount new script
      - ../data/raw/RWF-2000:/app/data/raw/RWF-2000:ro
      - ../data/metadata:/app/data/metadata:ro
      - rtsp-pusher-tmp:/app/tmp
    depends_on:
      mediamtx:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.00"
    networks:
      - violence-detection-net
    restart: on-failure

  # --- Mediamtx RTSP Server (optional — real camera streaming) ---
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    profiles: [streaming]
    ports:
      - "8554:8554"
      - "8888:8888"
      - "8889:8889"
      - "8189:8189/udp"
    environment:
      RTSP_AUTH_USER: ""
      MTX_PROTOCOLS: tcp
      RTSP_AUTH_PASS: ""
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
    networks:
      - violence-detection-net
    restart: unless-stopped
    volumes:
      - ../config/mediamtx/mediamtx.yml:/mediamtx.yml

  # --- RTSP Inference Mock (optional — real RTSP + mock AI) ---
  # Reads frames from MediaMTX RTSP streams, generates mock inference results.
  # Replace mock_inference() in rtsp_inference_mock.py to plug in the real AI model.
  # NOTE: stop inference-mock first to avoid duplicate Kafka messages:
  #   docker exec inference-mock touch /app/tmp/STOP
  rtsp-inference-mock:
    build:
      context: ..
      dockerfile: docker/Dockerfile.producer
    container_name: rtsp-inference-mock
    profiles: [streaming]
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: urban-safety-alerts
      METADATA_FILE: /app/data/metadata/camera_registry.csv
      STOP_FILE: /app/tmp/STOP
      RTSP_FPS: "1"
      RTSP_TIMEOUT_S: "5"
      RECONNECT_DELAY_S: "2"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../scripts/streaming:/app/scripts
      - ../data:/app/data
      - rtsp-inference-tmp:/app/tmp
    command: python /app/scripts/rtsp_inference_mock.py
    depends_on:
      kafka:
        condition: service_healthy
      mediamtx:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.00"   # increased: ffmpeg frame capture needs CPU headroom
    networks:
      - violence-detection-net
    restart: on-failure

  # --- Frame Evidence Extractor (S3 upload service) ---
  frame-extractor:
    build:
      context: ..
      dockerfile: docker/Dockerfile.producer
    container_name: frame-extractor
    environment:
      KAFKA_BROKER: kafka:9092
      S3_ENDPOINT: http://minio:9000
      # Public HTTP URL used in stored frame_url (browser-accessible via host port 9000)
      S3_PUBLIC_URL: http://localhost:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mypassword}
      STOP_FILE: /app/tmp/STOP
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../scripts/transform:/app/scripts/transform
      - ../scripts/streaming:/app/scripts
      - frame-extractor-tmp:/app/tmp
    command: python /app/scripts/transform/frame_extractor_sink.py
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.50"
    networks:
      - violence-detection-net
    restart: on-failure

  # =========================
  # Flink JobManager
  # =========================
  jobmanager:
    build:
      context: .
      dockerfile: Dockerfile.flink
    container_name: jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        s3.endpoint: http://minio:9000
        s3.access-key: ${MINIO_ROOT_USER:-minio}
        s3.secret-key: ${MINIO_ROOT_PASSWORD:-mypassword}
        s3.path.style.access: true
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - violence-detection-net
    volumes:
      - ../scripts/transform:/opt/flink/scripts
      # Fluss batch scanner reads KV snapshots directly from this path
      - fluss-tablet-remote:/var/fluss/remote-data
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "0.50"

  # =========================
  # Pipeline Manager
  # Tự động: startup jobs + watchdog + daily archival
  # HOT (Fluss) + WARM (Paimon) luôn chạy
  # COLD (Iceberg) archive mỗi ngày lúc 02:00
  # =========================
  pipeline-manager:
    build:
      context: .
      dockerfile: Dockerfile.flink
    container_name: pipeline-manager
    command: python3 /opt/flink/scripts/pipeline_manager.py
    environment:
      - FLINK_API=http://jobmanager:8081
      - FLINK_JM_ADDRESS=jobmanager
      - FLINK_JM_RPC_PORT=6123
      - SCRIPTS_DIR=/opt/flink/scripts
      - CHECK_INTERVAL_SECONDS=300
      - ARCHIVE_HOUR=2
      - STARTUP_WAIT_SECS=180
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-mypassword}
      - S3_ENDPOINT=http://minio:9000
      - PAIMON_WAREHOUSE=s3://warehouse/paimon
      - HIVE_METASTORE_URI=thrift://hive-metastore:9083
      - ICEBERG_WAREHOUSE=s3a://warehouse/iceberg_warehouse
      - KAFKA_BROKER=kafka:9092
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        jobmanager.rpc.port: 6123
        rest.address: jobmanager
        rest.port: 8081
        s3.endpoint: http://minio:9000
        s3.access-key: ${MINIO_ROOT_USER:-minio}
        s3.secret-key: ${MINIO_ROOT_PASSWORD:-mypassword}
        s3.path.style.access: true
    depends_on:
      jobmanager:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - violence-detection-net
    volumes:
      - ../scripts/transform:/opt/flink/scripts
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  # =========================
  # Flink TaskManager
  # =========================
  taskmanager:
    build:
      context: .
      dockerfile: Dockerfile.flink
    container_name: taskmanager
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 8
        taskmanager.memory.process.size: 1536m
    networks:
      - violence-detection-net
    volumes:
      - ../scripts/transform:/opt/flink/scripts
      # Fluss batch scanner reads KV snapshot files directly from this path
      - fluss-tablet-remote:/var/fluss/remote-data
    restart: always
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.00"

  # =========================
  # HOT STORAGE (Apache Fluss)
  # =========================
  fluss-zookeeper:
    image: zookeeper:3.9.2
    container_name: fluss-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: "ruok"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    networks:
      - violence-detection-net
    restart: always

  fluss-coordinator:
    image: apache/fluss:0.9.0-incubating
    container_name: fluss-coordinator
    command: coordinatorServer
    environment:
      FLUSS_PROPERTIES: |
        zookeeper.address: fluss-zookeeper:2181
        bind.listeners: INTERNAL://0.0.0.0:9092,CLIENT://0.0.0.0:9123
        advertised.listeners: INTERNAL://fluss-coordinator:9092,CLIENT://fluss-coordinator:9123
        internal.listener.name: INTERNAL
        client.listener.name: CLIENT
        remote.data.dir: /var/fluss/remote-data
    ports:
      - "9123:9123"
    # Share the same remote-data volume as fluss-tablet so that:
    # - coordinator writes _METADATA files to the shared volume
    # - tablet can read them from the same volume
    volumes:
      - fluss-tablet-remote:/var/fluss/remote-data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9123' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
    networks:
      - violence-detection-net
    depends_on:
      fluss-zookeeper:
        condition: service_healthy
    restart: always

  fluss-tablet:
    image: apache/fluss:0.9.0-incubating
    container_name: fluss-tablet
    command: tabletServer
    environment:
      FLUSS_PROPERTIES: |
        zookeeper.address: fluss-zookeeper:2181
        bind.listeners: INTERNAL://0.0.0.0:9093,CLIENT://0.0.0.0:9094
        advertised.listeners: INTERNAL://fluss-tablet:9093,CLIENT://fluss-tablet:9094
        internal.listener.name: INTERNAL
        client.listener.name: CLIENT
        data.dir: /var/fluss/data
        remote.data.dir: /var/fluss/remote-data
    ports:
      - "9094:9094"
    volumes:
      - fluss-tablet-data:/var/fluss/data
      - fluss-tablet-remote:/var/fluss/remote-data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9094' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
    networks:
      - violence-detection-net
    depends_on:
      fluss-zookeeper:
        condition: service_healthy
      fluss-coordinator:
        condition: service_healthy
    restart: always

  # ---- Hive Metastore -----
  mysql:
    image: mysql:8.4.5
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${METASTORE_DB_PASSWORD:-root}
      MYSQL_DATABASE: ${METASTORE_DB_NAME:-metastore}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
    networks:
      - violence-detection-net
    restart: unless-stopped

  hive-metastore:
    build:
      context: ..
      dockerfile: docker/Dockerfile.hive
    container_name: hive-metastore
    hostname: hive-metastore
    ports:
      - "9083:9083"
    environment:
      - HIVE_SCHEMA_ACTION=init
      - WAIT_FOR_HOST=mysql
      - WAIT_FOR_PORT=3306
      - WAIT_TIMEOUT=120
      - HIVE_HOME=/opt/hive
      - METASTORE_DB_USER=${METASTORE_DB_USER:-root}
      - METASTORE_DB_PASSWORD=${METASTORE_DB_PASSWORD:-root}
      - METASTORE_DB_NAME=${METASTORE_DB_NAME:-metastore}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-mypassword}
    volumes:
      - ../config/hive_metastore/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"
    networks:
      - violence-detection-net
    restart: unless-stopped

  # ---- Monitoring (optional) -----
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles: [monitoring]
    ports:
      - "9090:9090"
    volumes:
      - ../config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - jobmanager
      - taskmanager
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    networks:
      - violence-detection-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    profiles: [monitoring]
    ports:
      - "3001:3000"
    user: "0"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_INSTALL_PLUGINS=trino-datasource
    depends_on:
      - prometheus
    volumes:
      - grafana-storage:/var/lib/grafana
      - ../config/grafana/provisioning:/etc/grafana/provisioning
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    networks:
      - violence-detection-net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    profiles: [monitoring]
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host)($$|/)'
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.10"
    restart: unless-stopped
    networks:
      - violence-detection-net

  # ---- Flink SQL Gateway (HOT query endpoint — Fluss via Flink SQL) -----
  # Profile: gateway — start with: docker compose --profile gateway up -d flink-sql-gateway
  # API: http://localhost:8083/v1/
  # Used by chatbot to query Fluss (hot layer). Paimon (warm) now uses Trino native.
  flink-sql-gateway:
    build:
      context: .
      dockerfile: Dockerfile.flink
    container_name: flink-sql-gateway
    profiles: [gateway]
    command: bash -c "/opt/flink/bin/sql-gateway.sh start-foreground"
    ports:
      - "8083:8083"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-mypassword}
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        rest.address: jobmanager
        rest.port: 8081
        sql-gateway.endpoint.rest.address: 0.0.0.0
        sql-gateway.endpoint.rest.port: 8083
        s3.endpoint: http://minio:9000
        s3.access-key: ${MINIO_ROOT_USER:-minio}
        s3.secret-key: ${MINIO_ROOT_PASSWORD:-mypassword}
        s3.path.style.access: true
    depends_on:
      - jobmanager
      - fluss-coordinator
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "0.25"
    volumes:
      # Fluss batch scanner reads KV snapshot files directly from this path
      - fluss-tablet-remote:/var/fluss/remote-data
    networks:
      - violence-detection-net
    restart: unless-stopped

  # ---- Trino -----
  trino-coordinator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.trino
    image: trino-with-s3a
    container_name: trino-coordinator
    hostname: trino-coordinator
    ports:
      - "8082:8080"
    volumes:
      - ../config/trino/coordinator/etc:/etc/trino
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-mypassword}
    depends_on:
      - hive-metastore
    healthcheck:
      # CMD-SHELL ensures shell PATH lookup finds curl (trinodb/trino image ships curl in /usr/bin)
      test: ["CMD-SHELL", "curl -f -s http://localhost:8080/v1/info || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1536m
          cpus: "1.00"
    networks:
      - violence-detection-net
    restart: unless-stopped

  trino-worker-1:
    image: trino-with-s3a
    container_name: trino-worker-1
    hostname: trino-worker-1
    profiles: [scaling]
    volumes:
      - ../config/trino/worker1/etc:/etc/trino
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.00"
    networks:
      - violence-detection-net

  trino-worker-2:
    image: trino-with-s3a
    container_name: trino-worker-2
    hostname: trino-worker-2
    profiles: [scaling]
    volumes:
      - ../config/trino/worker2/etc:/etc/trino
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.00"
    networks:
      - violence-detection-net

  # ---- Chatbot (Agentic RAG - FastAPI + LangGraph) -----
  chatbot:
    build:
      context: ..
      dockerfile: docker/Dockerfile.chatbot
    container_name: chatbot
    environment:
      # API Configuration
      - API_PORT=5002
      - API_HOST=0.0.0.0
      - DEBUG=False
      - LOG_FORMAT=json
      - LOG_LEVEL=INFO

      # LLM Configuration
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-2.5-flash

      # ChromaDB Configuration
      - CHROMA_DIR=/data/chroma
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - CHROMA_COLLECTION_NAME=violence_detection_rag

      # Trino Configuration
      - TRINO_HOST=trino-coordinator
      - TRINO_PORT=8080
      - TRINO_USER=trino
      - TRINO_CATALOG=iceberg
      - TRINO_SCHEMA=security

      # Flink SQL Gateway (HOT/Fluss queries — start with --profile gateway)
      - FLINK_GATEWAY_HOST=flink-sql-gateway
      - FLINK_GATEWAY_PORT=8083

      # MinIO/S3 Configuration
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=evidence-frames
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      # Public URL for evidence frames (host-accessible, port 9000)
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}

      # Data Ingest Configuration
      - ICEBERG_BUCKET=${ICEBERG_BUCKET}
      - ICEBERG_PREFIX=${ICEBERG_PREFIX}
      - INGEST_INTERVAL_SECONDS=300

      # Agent Configuration
      - MAX_RETRIES=3
      - QUERY_TIMEOUT_SECONDS=30
      - RESPONSE_TIMEOUT_SECONDS=60

    volumes:
      - chroma_data:/data/chroma
      - chroma_model_cache:/root/.cache/chroma  # Cache ONNX models — avoids 79MB re-download on restart
      - frame-extractor-tmp:/app/tmp

    ports:
      - "5002:5002"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 1536m
          cpus: "1.00"

    depends_on:
      minio:
        condition: service_healthy
      trino-coordinator:
        condition: service_healthy

    networks:
      - violence-detection-net

    restart: on-failure:5

    labels:
      - "com.example.description=Chatbot API - LangGraph Agentic RAG"
      - "com.example.version=2.0.0"

networks:
  violence-detection-net:
    name: violence-detection-net
    external: true
volumes:
  kafka-data:
  minio_data:
  mysql-data:
  grafana-storage:
  chroma_data:
  chroma_model_cache:  # Persists ONNX models (~79MB) across container restarts
  rtsp-inference-tmp:
  rtsp-pusher-tmp:
  frame-extractor-tmp:
  fluss-tablet-data:
  fluss-tablet-remote:
