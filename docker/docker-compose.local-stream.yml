# docker/docker-compose.local-stream.yml
# Lightweight local RTSP streaming stack → GCP Kafka
#
# Starts 3 services only (mediamtx + rtsp_pusher + rtsp-inference-mock).
# No local Kafka required — events are published directly to GCP Kafka (port 9093).
#
# Usage (from project root):
#   docker compose -f docker/docker-compose.local-stream.yml up -d
#
# Stop gracefully:
#   docker exec rtsp-inference-mock touch /app/tmp/STOP
#   docker exec rtsp_pusher touch /app/tmp/STOP
#
# Verify:
#   docker logs rtsp-inference-mock --tail 20

services:

  # RTSP server — receives ffmpeg pushes and serves RTSP/HLS streams
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    ports:
      - "8554:8554"   # RTSP
      - "8888:8888"   # HLS
      - "8889:8889"   # WebRTC
      - "8189:8189/udp"
      - "9997:9997"   # MediaMTX API
    environment:
      RTSP_AUTH_USER: ""
      MTX_PROTOCOLS: tcp
      RTSP_AUTH_PASS: ""
    volumes:
      - ../config/mediamtx/mediamtx.yml:/mediamtx.yml
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
    networks:
      - local-stream-net
    restart: unless-stopped

  # Pushes RWF-2000 video clips to MediaMTX via ffmpeg (simulates RTSP cameras)
  rtsp_pusher:
    image: docker-rtsp_pusher:latest
    command: python /app/rtsp_pusher.py
    container_name: rtsp_pusher
    environment:
      METADATA_FILE: /app/data/metadata/camera_registry.csv
      FIGHT_DIR: /app/data/raw/RWF-2000/train/Fight
      NON_FIGHT_DIR: /app/data/raw/RWF-2000/train/NonFight
      FIGHT_MANIFEST: /app/data/metadata/fight_clips_manifest.txt
      NONFIGHT_MANIFEST: /app/data/metadata/nonfight_clips_manifest.txt
      MEDIAMTX_HOST: mediamtx
      MAX_CAMERAS: "5"
      CLIPS_PER_CAM: "6"
      STOP_FILE: /app/tmp/STOP
      ACTIVE_CAMERAS: "${ACTIVE_CAMERAS:-}"
    volumes:
      - ../scripts/streaming/rtsp_pusher.py:/app/rtsp_pusher.py:ro
      - ../data/raw/RWF-2000:/app/data/raw/RWF-2000:ro
      - ../data/metadata:/app/data/metadata:ro
      - local-pusher-tmp:/app/tmp
    depends_on:
      mediamtx:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.00"
    networks:
      - local-stream-net
    restart: on-failure

  # Captures RTSP frames, runs mock AI inference, publishes results to GCP Kafka
  rtsp-inference-mock:
    build:
      context: ..
      dockerfile: docker/Dockerfile.producer
    container_name: rtsp-inference-mock
    command: python /app/scripts/rtsp_inference_mock.py
    environment:
      KAFKA_BROKER: "34.158.32.82:9093"   # GCP Kafka external listener
      KAFKA_TOPIC: urban-safety-alerts
      METADATA_FILE: /app/data/metadata/camera_registry.csv
      STOP_FILE: /app/tmp/STOP
      RTSP_FPS: "1"
      RTSP_TIMEOUT_S: "5"
      RECONNECT_DELAY_S: "2"
      PYTHONUNBUFFERED: "1"
      ACTIVE_CAMERAS: "${ACTIVE_CAMERAS:-}"
    volumes:
      - ../scripts/streaming:/app/scripts
      - ../data:/app/data
      - local-inference-tmp:/app/tmp
    depends_on:
      mediamtx:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.00"
    networks:
      - local-stream-net
    restart: on-failure

networks:
  local-stream-net:
    name: local-stream-net

volumes:
  local-pusher-tmp:
  local-inference-tmp:
