# =============================================================================
# Nginx Reverse Proxy — Streamhouse Violence Detection
# Place at: /etc/nginx/sites-available/vigilance
# Run: sudo certbot --nginx -d yourdomain.com -d api.yourdomain.com ...
# =============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_chat:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api_static:10m rate=300r/m;

# ─── Chatbot API ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.yourdomain.com;

    # SSL — certbot will fill these in
    # ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # CORS — allow Vercel frontend
    add_header Access-Control-Allow-Origin "https://vigilance-ai.vercel.app" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    # Chatbot endpoints (rate limited)
    location /chat {
        limit_req zone=api_chat burst=5 nodelay;
        proxy_pass http://localhost:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;  # LLM can take time
    }

    # API endpoints (moderate rate limit)
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://localhost:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Health check (no rate limit)
    location /health {
        proxy_pass http://localhost:5002;
        access_log off;
    }

    # OPTIONS preflight
    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://vigilance-ai.vercel.app";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Content-Length 0;
            return 204;
        }
        return 404;
    }
}

# ─── Grafana (password-protected) ───────────────────────────────────────────
server {
    listen 80;
    server_name grafana.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name grafana.yourdomain.com;

    # SSL — certbot will fill these in
    # ssl_certificate ...
    # ssl_certificate_key ...

    ssl_protocols TLSv1.2 TLSv1.3;

    # Optional: Basic auth for extra security
    # auth_basic "Grafana Access";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        limit_req zone=api_static burst=50 nodelay;
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ─── MinIO Console (admin only) ──────────────────────────────────────────────
server {
    listen 80;
    server_name minio.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name minio.yourdomain.com;

    # SSL — certbot will fill these in
    # ssl_certificate ...
    # ssl_certificate_key ...

    ssl_protocols TLSv1.2 TLSv1.3;

    # MinIO Console
    location / {
        proxy_pass http://localhost:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # MinIO API (S3) — for evidence frame public access
    location /evidence-frames/ {
        limit_req zone=api_static burst=100 nodelay;
        proxy_pass http://localhost:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Cache public frames
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400";
    }
}

# ─── Flink UI (admin only, optional) ─────────────────────────────────────────
server {
    listen 80;
    server_name flink.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name flink.yourdomain.com;

    # Restrict to admin IPs only
    # allow your.admin.ip.address;
    # deny all;

    location / {
        proxy_pass http://localhost:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
