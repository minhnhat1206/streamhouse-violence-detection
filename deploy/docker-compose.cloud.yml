# =============================================================================
# Docker Compose — Cloud Deployment (Oracle Cloud Free Tier ARM64)
# Target: VM.Standard.A1.Flex — 4 OCPU, 24GB RAM, 200GB disk
# Usage: docker compose -f deploy/docker-compose.cloud.yml up -d
# Env:   docker compose --env-file deploy/.env.cloud -f deploy/docker-compose.cloud.yml up -d
# =============================================================================
# NOTE: Streaming profile (rtsp_pusher, mediamtx, rtsp-inference-mock) is EXCLUDED.
#       VioMoViNet runs on a separate GPU machine and pushes directly to Kafka.
# =============================================================================

services:

  # ─── KAFKA (KRaft mode) ──────────────────────────────────────────────────
  kafka:
    container_name: kafka
    image: apache/kafka:4.0.1-rc2
    platform: linux/arm64
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # External listener for VioMoViNet on remote machine
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://${ORACLE_VM_PUBLIC_IP}:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # Reduce retention for storage savings (cloud disk is limited)
      KAFKA_LOG_RETENTION_HOURS: 6
      KAFKA_LOG_SEGMENT_BYTES: 104857600
    ports:
      - "9092:9092"    # Internal (Docker network)
      - "9093:9093"    # External (VioMoViNet on remote machine)
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ../scripts/setup:/scripts/setup:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --version || exit 1"]
      interval: 15s
      timeout: 30s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g      # Increased for ARM64 stability
          cpus: "1.00"
    networks:
      - violence-detection-net
    restart: unless-stopped

  # ─── MINIO ───────────────────────────────────────────────────────────────
  minio:
    container_name: minio
    image: dataguy16/minio:latest
    platform: linux/arm64
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
    networks:
      - violence-detection-net
    restart: unless-stopped

  minio_client:
    container_name: minio_client
    image: dataguy16/minio-client:latest
    platform: linux/arm64
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.10"
    networks:
      - violence-detection-net
    restart: no

  # ─── MYSQL (Hive Metastore) ──────────────────────────────────────────────
  mysql:
    container_name: mysql
    image: mysql:8.4.5
    platform: linux/amd64   # Use emulation — mysql ARM64 image is less stable
    environment:
      MYSQL_ROOT_PASSWORD: ${METASTORE_DB_PASSWORD}
      MYSQL_DATABASE: ${METASTORE_DB_NAME}
      MYSQL_USER: ${METASTORE_DB_USER}
      MYSQL_PASSWORD: ${METASTORE_DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${METASTORE_DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
    networks:
      - violence-detection-net
    restart: unless-stopped

  # ─── HIVE METASTORE ──────────────────────────────────────────────────────
  hive-metastore:
    container_name: hive-metastore
    build:
      context: ..
      dockerfile: docker/Dockerfile.hive
      args:
        TARGETPLATFORM: linux/arm64
    platform: linux/arm64
    env_file:
      - .env.cloud
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9083 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"
    networks:
      - violence-detection-net
    restart: unless-stopped

  # ─── FLUSS (HOT Layer) ───────────────────────────────────────────────────
  fluss-zookeeper:
    container_name: fluss-zookeeper
    image: zookeeper:3.9.2
    # NOTE: Check ARM64 availability for apache/fluss:0.9.0-incubating
    # If not available, this section may need platform: linux/amd64 (emulation)
    volumes:
      - fluss-zookeeper-data:/data
      - fluss-zookeeper-datalog:/datalog
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    networks:
      - violence-detection-net
    restart: unless-stopped

  fluss-coordinator:
    container_name: fluss-coordinator
    image: apache/fluss:0.9.0-incubating
    command: coordinatorServer
    depends_on:
      fluss-zookeeper:
        condition: service_healthy
    environment:
      - |
        FLUSS_PROPERTIES=
        zookeeper.address: fluss-zookeeper:2181
        coordinator.host: fluss-coordinator
        remote.data.dir: s3://paimon/fluss
        fs.s3.endpoint: http://minio:9000
        fs.s3.access-key: ${MINIO_ROOT_USER}
        fs.s3.secret-key: ${MINIO_ROOT_PASSWORD}
        fs.s3.path.style.access: true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
    networks:
      - violence-detection-net
    restart: unless-stopped

  fluss-tablet:
    container_name: fluss-tablet
    image: apache/fluss:0.9.0-incubating
    command: tabletServer
    depends_on:
      fluss-coordinator:
        condition: service_started
    environment:
      - |
        FLUSS_PROPERTIES=
        zookeeper.address: fluss-zookeeper:2181
        tablet-server.host: fluss-tablet
        remote.data.dir: s3://paimon/fluss
        fs.s3.endpoint: http://minio:9000
        fs.s3.access-key: ${MINIO_ROOT_USER}
        fs.s3.secret-key: ${MINIO_ROOT_PASSWORD}
        fs.s3.path.style.access: true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
    networks:
      - violence-detection-net
    restart: unless-stopped

  # ─── FLINK (Compute) ─────────────────────────────────────────────────────
  jobmanager:
    container_name: jobmanager
    build:
      context: ..
      dockerfile: docker/Dockerfile.flink
      args:
        TARGETPLATFORM: linux/arm64
    platform: linux/arm64
    command: jobmanager
    ports:
      - "8081:8081"
      - "9249:9249"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend: rocksdb
        state.checkpoints.dir: s3://paimon/flink-checkpoints
        s3.endpoint: http://minio:9000
        s3.access-key: ${MINIO_ROOT_USER}
        s3.secret-key: ${MINIO_ROOT_PASSWORD}
        s3.path.style.access: true
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    env_file:
      - .env.cloud
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/overview || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "0.50"
    networks:
      - violence-detection-net
    restart: unless-stopped

  taskmanager:
    container_name: taskmanager
    build:
      context: ..
      dockerfile: docker/Dockerfile.flink
      args:
        TARGETPLATFORM: linux/arm64
    platform: linux/arm64
    command: taskmanager
    ports:
      - "9250:9250"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 2048m
        state.backend: rocksdb
        state.checkpoints.dir: s3://paimon/flink-checkpoints
        s3.endpoint: http://minio:9000
        s3.access-key: ${MINIO_ROOT_USER}
        s3.secret-key: ${MINIO_ROOT_PASSWORD}
        s3.path.style.access: true
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9250
    env_file:
      - .env.cloud
    volumes:
      - ../scripts/transform:/opt/flink/scripts
    depends_on:
      jobmanager:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2500m   # Slightly under 3g limit to leave ARM headroom
          cpus: "2.00"
    networks:
      - violence-detection-net
    restart: unless-stopped

  # ─── PIPELINE MANAGER ────────────────────────────────────────────────────
  pipeline-manager:
    container_name: pipeline-manager
    build:
      context: ..
      dockerfile: docker/Dockerfile.flink
      args:
        TARGETPLATFORM: linux/arm64
    platform: linux/arm64
    command: ["python3", "/opt/flink/scripts/pipeline_manager.py"]
    environment:
      - FLINK_JOBMANAGER_URL=http://jobmanager:8081
      - FLINK_SQL_GATEWAY_URL=http://flink-sql-gateway:8083
    env_file:
      - .env.cloud
    volumes:
      - ../scripts/transform:/opt/flink/scripts
    depends_on:
      jobmanager:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"
    networks:
      - violence-detection-net
    restart: unless-stopped

  # ─── FLINK SQL GATEWAY ────────────────────────────────────────────────────
  flink-sql-gateway:
    container_name: flink-sql-gateway
    build:
      context: ..
      dockerfile: docker/Dockerfile.flink
      args:
        TARGETPLATFORM: linux/arm64
    platform: linux/arm64
    command: ["bin/sql-gateway.sh", "start-foreground"]
    ports:
      - "8083:8083"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        sql-gateway.endpoint.rest.address: 0.0.0.0
        sql-gateway.endpoint.rest.port: 8083
    depends_on:
      jobmanager:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"
    networks:
      - violence-detection-net
    restart: unless-stopped

  # ─── TRINO ───────────────────────────────────────────────────────────────
  trino-coordinator:
    container_name: trino-coordinator
    image: trino-with-s3a
    platform: linux/arm64
    ports:
      - "8082:8080"
    volumes:
      - ../config/trino:/etc/trino
    depends_on:
      hive-metastore:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v1/info || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g    # Reduced from 1.5g to stay in ARM budget
          cpus: "1.00"
    networks:
      - violence-detection-net
    restart: unless-stopped

  # ─── CHATBOT API ─────────────────────────────────────────────────────────
  chatbot:
    container_name: chatbot
    build:
      context: ..
      dockerfile: docker/Dockerfile.chatbot
      args:
        TARGETPLATFORM: linux/arm64
    platform: linux/arm64
    ports:
      - "5002:5002"
    env_file:
      - .env.cloud
    volumes:
      - chatbot-chroma:/app/chroma_db
    depends_on:
      trino-coordinator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5002/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.00"
    networks:
      - violence-detection-net
    restart: unless-stopped

  # ─── MONITORING (optional profile) ──────────────────────────────────────
  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    profiles: [monitoring]
    ports:
      - "9090:9090"
    volumes:
      - ../config/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.path=/prometheus
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    networks:
      - violence-detection-net
    restart: unless-stopped

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    profiles: [monitoring]
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=https://${GRAFANA_DOMAIN:-localhost:3001}
    volumes:
      - grafana-storage:/var/lib/grafana
      - ../config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    networks:
      - violence-detection-net
    restart: unless-stopped

  node-exporter:
    container_name: node-exporter
    image: prom/node-exporter:latest
    profiles: [monitoring]
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.10"
    networks:
      - violence-detection-net
    restart: unless-stopped

# ─── VOLUMES ─────────────────────────────────────────────────────────────────
volumes:
  kafka-data:
  minio_data:
  mysql-data:
  grafana-storage:
  prometheus-data:
  chatbot-chroma:
  fluss-zookeeper-data:
  fluss-zookeeper-datalog:

# ─── NETWORKS ────────────────────────────────────────────────────────────────
networks:
  violence-detection-net:
    external: true
    name: violence-detection-net
