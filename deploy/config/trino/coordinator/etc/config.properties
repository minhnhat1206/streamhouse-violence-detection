coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080

# ── Memory — tuned for the cloud VM (2GB container limit) ───────
# 2GB container → heap ~1400MB → per-query max 900MB
query.max-memory=900MB
query.max-memory-per-node=900MB

# ── Optimizer ─────────────────────────────────────────────────
optimizer.join-reordering-strategy=AUTOMATIC

# ── Task execution — 4 ARM OCPU shared with other services ────
task.concurrency=2
task.max-worker-threads=4

# ── Network compression ───────────────────────────────────────
exchange.compression-codec=LZ4

# ── Spilling to disk (ample disk on the VM) ──────────────
spill-enabled=true
spiller-spill-path=/tmp/trino-spill
max-spill-per-node=8GB

discovery-server.enabled=true
discovery.uri=http://trino-coordinator:8080
