# =============================================================================
# Flink Configuration — Cloud (Oracle ARM64, 4 OCPU, 24GB RAM)
# =============================================================================

# ── JobManager ────────────────────────────────────────────────────────────
jobmanager.rpc.address: jobmanager
jobmanager.memory.process.size: 1024m

# ── TaskManager ───────────────────────────────────────────────────────────
taskmanager.memory.process.size: 2048m
taskmanager.numberOfTaskSlots: 4

# ── State Backend ─────────────────────────────────────────────────────────
state.backend: rocksdb
state.backend.incremental: true
state.checkpoints.dir: s3://paimon/flink-checkpoints
state.savepoints.dir: s3://paimon/flink-savepoints

# ── S3 / MinIO ────────────────────────────────────────────────────────────
s3.endpoint: http://minio:9000
s3.path.style.access: true

# ── Checkpointing ─────────────────────────────────────────────────────────
execution.checkpointing.interval: 30s
execution.checkpointing.mode: EXACTLY_ONCE
execution.checkpointing.timeout: 10min
execution.checkpointing.min-pause: 20s
execution.checkpointing.max-concurrent-checkpoints: 1

# ── Restart strategy ──────────────────────────────────────────────────────
restart-strategy: fixed-delay
restart-strategy.fixed-delay.attempts: 5
restart-strategy.fixed-delay.delay: 10s

# ── Network / CPU (ARM64 tuning) ──────────────────────────────────────────
parallelism.default: 2
taskmanager.network.memory.fraction: 0.1
taskmanager.network.memory.min: 64mb
taskmanager.network.memory.max: 256mb

# ── Metrics ───────────────────────────────────────────────────────────────
metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
metrics.reporter.prom.port: 9249-9250

# ── Web UI ────────────────────────────────────────────────────────────────
web.submit.enable: true
web.cancel.enable: true
