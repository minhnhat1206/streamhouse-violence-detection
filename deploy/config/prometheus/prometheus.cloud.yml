# =============================================================================
# Prometheus — Cloud Scrape Config (Oracle ARM64)
# Internal Docker hostnames — only reachable inside violence-detection-net
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: cloud

scrape_configs:
  # ── Prometheus self ───────────────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ── Flink JobManager ─────────────────────────────────────────────────────
  - job_name: flink-jobmanager
    static_configs:
      - targets: ["jobmanager:9249"]
    metrics_path: /
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: jobmanager

  # ── Flink TaskManager ────────────────────────────────────────────────────
  - job_name: flink-taskmanager
    static_configs:
      - targets: ["taskmanager:9250"]
    metrics_path: /
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: taskmanager

  # ── Chatbot API ───────────────────────────────────────────────────────────
  - job_name: chatbot
    static_configs:
      - targets: ["chatbot:5002"]
    metrics_path: /metrics

  # ── Node Exporter (VM-level metrics) ─────────────────────────────────────
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: node_exporter
    static_configs:
      - targets: ["172.17.0.1:9100"]
