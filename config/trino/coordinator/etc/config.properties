coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080

# ── Memory management ─────────────────────────────────────────
# Single-node setup: query.max-memory = max-memory-per-node × 1 node
# 2GB để sẵn headroom khi bật scaling profile (+ workers)
query.max-memory=2GB
query.max-memory-per-node=700MB
# Với single node (no workers): effective limit = 700MB per query

# ── Cost-Based Optimizer (CBO) ────────────────────────────────
optimizer.join-reordering-strategy=AUTOMATIC

# ── Task execution (I/O-heavy workloads benefit from concurrency)
task.concurrency=4
task.max-worker-threads=8

# ── Network exchange: LZ4 compression giảm băng thông nội bộ ──
exchange.compression-codec=LZ4

# ── Spilling: tránh OOM khi query lớn vượt memory budget ──────
spill-enabled=true
spiller-spill-path=/tmp/trino-spill
max-spill-per-node=4GB

discovery-server.enabled=true
discovery.uri=http://trino-coordinator:8080