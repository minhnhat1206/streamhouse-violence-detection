connector.name=iceberg
iceberg.catalog.type=hive_metastore
hive.metastore.uri=thrift://hive-metastore:9083
s3.region=us-east-1
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
s3.path-style-access=true

# ── Metadata cache: giảm Thrift RPC đến Hive Metastore ─────────
iceberg.metadata-cache.enabled=true

# ── Hive Metastore client-side cache ───────────────────────────
hive.metastore-cache-ttl=1h
hive.metastore-refresh-interval=2m
hive.metastore-cache-maximum-size=10000