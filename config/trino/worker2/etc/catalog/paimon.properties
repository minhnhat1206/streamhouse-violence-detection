connector.name=paimon

# Paimon warehouse — must match warehouse path used in init_paimon_tables.py
warehouse=s3://warehouse/paimon

# Metastore: filesystem (catalog stored directly on S3, no Hive Metastore needed)
metastore=filesystem

# ── Trino native S3 filesystem ───────────────────────────────────────────────
# From paimon 0.8+, Paimon delegates all I/O to Trino's filesystem layer.
# Use Trino's native S3 driver (trino-filesystem-s3) instead of Hadoop S3A.
# Property names follow Trino's S3FileSystemConfig, NOT paimon's own s3.* keys.
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
s3.path-style-access=true
s3.ssl.enabled=false

# Scan optimizations
scan.infer-parallelism=true
scan.split-target-size=134217728
