logLevel: warn

# Management REST API
api: yes
apiAddress: :9997

# Allow unauthenticated access to the management API (internal network only)
authInternalUsers:
- user: any
  pass:
  ips: []
  permissions:
  - action: api
  - action: read
  - action: publish

rtsp: yes
rtspAddress: :8554

rtmp: no

hls: yes
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsSegmentDuration: 1s
hlsSegmentCount: 7

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigin: '*'

# Accept any publisher (rtsp_pusher pushes cam_XX streams here)
paths:
  all:
    source: publisher
    maxReaders: 50
