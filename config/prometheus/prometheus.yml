global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Flink JobManager REST API metrics
  - job_name: 'flink'
    static_configs:
      - targets: ['jobmanager:8081']

  # Fluss Coordinator metrics
  - job_name: 'fluss'
    static_configs:
      - targets: ['fluss-coordinator:9123']