global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Flink JobManager — Prometheus reporter (port 9249, enabled via FLINK_PROPERTIES)
  - job_name: 'flink-jobmanager'
    static_configs:
      - targets: ['jobmanager:9249']
    metrics_path: /
    scrape_timeout: 10s

  # Flink TaskManager — Prometheus reporter (port 9250)
  - job_name: 'flink-taskmanager'
    static_configs:
      - targets: ['taskmanager:9250']
    metrics_path: /
    scrape_timeout: 10s

  # Chatbot API — query duration histogram by layer (HOT/WARM/COLD)
  - job_name: 'chatbot'
    static_configs:
      - targets: ['chatbot:5002']
    metrics_path: /metrics
    scrape_timeout: 10s
